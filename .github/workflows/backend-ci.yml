name: Backend CI

on:
  push:
    branches: [ "main", "Backend-Dev" ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ "main", "Backend-Dev" ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Show .NET version
        run: dotnet --version

      - name: Show project files (debug)
        run: find backend -name "*.csproj" | sort

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('backend/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore packages
        run: dotnet restore backend/src/Government_Service_Navigator.Backend.csproj --verbosity normal

      - name: Build project
        run: dotnet build backend/src/Government_Service_Navigator.Backend.csproj --no-restore --configuration Release