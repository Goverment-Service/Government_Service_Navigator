name: Backend CI

on:
  push:
    branches: [ "main", "Backend-Dev" ]
    paths:
      - 'backend/**'
  pull_request:
    branches: [ "main", "Backend-Dev" ]
    paths:
      - 'backend/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('backend/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        working-directory: ./backend
        run: dotnet restore GSN.slnx

      - name: Build
        working-directory: ./backend
        run: dotnet build GSN.slnx --no-restore --configuration Release

      - name: Test
        working-directory: ./backend
        run: dotnet test GSN.slnx --no-build --configuration Release --verbosity normal