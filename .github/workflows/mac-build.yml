name: Build macOS App

on:
  push:
    branches: [ "main", "Front-Dev", "Testing" ]
    paths:
      - "web/**"
      - ".github/workflows/mac-build.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "web/**"
      - ".github/workflows/mac-build.yml"
  workflow_dispatch:

concurrency:
  group: mac-build.yml-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: macOS (dmg + zip, unsigned)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: web
    env:
      # No Apple Developer ID certificate yet, so skip code signing.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"
          cache-dependency-path: "web/package-lock.json"

      - name: Install dependencies
        run: npm ci

      # tsc -b && vite build -> web/dist, which Electron serves via electron/main.cjs.
      - name: Build web app
        run: npm run build

      - name: Package desktop app
        run: npx electron-builder --mac --x64 --arm64 --publish never

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: macos-app-${{ github.run_number }}
          path: |
            web/release/*.dmg
            web/release/*.zip
          retention-days: 14
