name: Build Windows App

on:
  push:
    branches: [ "main", "Front-Dev", "Testing" ]
    paths:
      - "web/**"
      - ".github/workflows/windows-software-build.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "web/**"
      - ".github/workflows/windows-software-build.yml"
  workflow_dispatch:

concurrency:
  group: windows-software-build.yml-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows installer (NSIS + portable)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"
          cache-dependency-path: "web/package-lock.json"

      - name: Install dependencies
        run: npm ci

      # tsc -b && vite build -> web/dist, which Electron serves via electron/main.cjs.
      - name: Build web app
        run: npm run build

      - name: Package desktop app
        run: npx electron-builder --win --publish never

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: windows-app-${{ github.run_number }}
          path: |
            web/release/*.exe
          retention-days: 14
